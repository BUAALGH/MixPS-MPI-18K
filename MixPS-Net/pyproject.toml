[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mixps-net"
version = "1.0.0"
description = "HCMM-guided dual-tracer harmonic-image separation for MPI"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Guanghui Li", email = "liguanghui@buaa.edu.cn"}]
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "h5py>=3.8",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "scikit-image>=0.21",
]

[tool.setuptools.packages.find]
include = ["mixps_net*"]
